# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lapsus"
dynamic = ["version"]
description = "Lapsus: a bilingual (English, Italian) grammatical acceptability dataset builder for teaching NLP."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "<AUTHOR_NAME>" }]
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "datasets>=2.18",
  "scikit-learn>=1.3",
  "datasketch>=1.6",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Shared heavy tooling used by the full pipeline (parsing, LM scoring, LanguageTool, language ID).
pipeline = [
  "stanza==1.15.0",
  "torch>=2.1",
  "transformers>=4.40",
  "language-tool-python>=2.9",
  "lingua-language-detector>=2.0",
]
en = ["lapsus[pipeline]", "lemminflect==0.2.3"]
it = ["lapsus[pipeline]"]
hub = ["huggingface_hub>=0.24"]
test = ["pytest>=7.4", "lemminflect==0.2.3"]

[project.scripts]
lapsus = "lapsus.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["lapsus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
